[workspace]
resolver = "2"
members = ["app", "krnl_add_vectors"]

[workspace.dependencies]
env_logger = "0.11"
log = "0.4"
pixels = "0.17"
winit = "0.30"
winit_input_helper = "0.17"
num-complex = "0.4"
rayon = "1"
krnl = { path="../krnl" }
krnl-core = { path="../krnl" }
krnl-macros = { path="../krnl" }
krnlc = { path="../krnl" }

[profile.release.build-override]
opt-level = 3
codegen-units = 16

[profile.dev.build-override]
opt-level = 3
